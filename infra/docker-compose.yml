services:
  db:
    image: postgres:16-alpine
    container_name: sensory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sensory
      POSTGRES_USER: sensory
      POSTGRES_PASSWORD: sensory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensory -d sensory"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sensory-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
